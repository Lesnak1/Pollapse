name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: TypeScript Typecheck
      run: npx tsc --noEmit

    - name: Run Unit Tests
      run: npm run test

    - name: Next.js Production Build
      run: npm run build
      env:
        NEXT_PUBLIC_PRIVY_APP_ID: clqy12345abcdefghijmockid
        NEXT_PUBLIC_POLY_BUILDER_CODE: 0xdc821268d88389abfb9f48657fc082cbc69c64148b966423ae74353e147500ad
        NEXT_PUBLIC_POLY_CLOB_HOST: https://clob.polymarket.com
